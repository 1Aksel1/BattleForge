name: CI-CD

on:
 push:
  branches: [main]

permissions:
 contents: read
 packages: write

jobs:
 build-and-push:
  runs-on: ubuntu-latest
  steps:

   - name: Checkout code
     uses: actions/checkout@v4
   
   - name: Log in to GHCR
     uses: docker/login-action@v3
     with:
       registry: ghcr.io
       username: ${{ github.actor }}
       password: ${{ secrets.GITHUB_TOKEN }}

   - name: Build and push backend
     uses: docker/build-push-action@v5
     with:
       context: ./backend/battleforge-backend
       push: true
       tags: |
         ghcr.io/1aksel1/battleforge-backend:latest
         ghcr.io/1aksel1/battleforge-backend:${{ github.sha }}

   - name: Build and push frontend
     uses: docker/build-push-action@v5
     with:
       context: ./frontend/battleforge-frontend
       push: true
       tags: |
         ghcr.io/1aksel1/battleforge-frontend:latest
         ghcr.io/1aksel1/battleforge-frontend:${{ github.sha }}

 deploy:
  needs: build-and-push
  runs-on: ubuntu-latest
  steps:

   - name: Checkout code
     uses: actions/checkout@v4

   - name: Authenticate to GCP
     uses: google-github-actions/auth@v2
     with:
      credentials_json: ${{ secrets.GCP_SA_KEY }}
  
   - name: Set up GKE credentials
     uses: google-github-actions/get-gke-credentials@v2
     with:
      cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
      location: ${{ secrets.GKE_ZONE }}
  
   - name: Inject secret values
     run: |
      sed -i "s|__DB_USER_B64__|${{ secrets.DB_USER_B64 }}|g" k8s/db-secret.yaml
      sed -i "s|__DB_PASSWORD_B64__|${{ secrets.DB_PASSWORD_B64 }}|g" k8s/db-secret.yaml
      
   - name: Update image tags in manifests
     run: |
      sed -i "s|ghcr.io/1aksel1/battleforge-backend:latest|ghcr.io/1aksel1/battleforge-backend:${{ github.sha }}|g" k8s/backend-deployment.yaml
      sed -i "s|ghcr.io/1aksel1/battleforge-frontend:latest|ghcr.io/1aksel1/battleforge-frontend:${{ github.sha }}|g" k8s/frontend-deployment.yaml
  
   - name: Deploy to GKE
     run: kubectl apply -f k8s/





