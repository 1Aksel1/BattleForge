<h1>Welcome to BattleForge, {{ username }}</h1>

<div class="menu-actions">
  <button class="btn-primary" (click)="startRun()">New Run</button>

  @if (status?.hasActiveRun && !status?.hasActiveBattle) {
    <button class="btn-primary" (click)="continueRun()">Continue Run</button>
  }

  @if (status?.hasActiveRun && status?.hasActiveBattle) {
    <button class="btn-primary" (click)="continueBattle()">Continue Battle</button>
  }

  <button class="btn-danger" (click)="exit()">Exit</button>
</div>
