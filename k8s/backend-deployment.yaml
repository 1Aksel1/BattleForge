apiVersion: apps/v1
kind: Deployment
metadata:
 name: backend-deployment
spec:
 replicas: 1
 selector:
  matchLabels:
   app: backend
 template:
  metadata:
   labels:
    app: backend
  spec: 
    containers:
    - name: battleforge-backend
      image: ghcr.io/1aksel1/battleforge-backend:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 8080
      envFrom:
        - configMapRef:
           name: backend-configmap
        - secretRef:
           name: db-secret
      resources:
       requests:
        cpu: "250m"
        memory: "512Mi"
       limits:
        cpu: "500m"
        memory: "768Mi"
